<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Global Incorporation">
  <defs>
    <linearGradient id="giGlobeBold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!--
    Optical variant for the 16–64 px renditions (and favicon.ico). The mark is
    enlarged and the hairline latitude rows are dropped, because at 16 px a 20
    unit stroke falls below one device pixel and turns to mush.
  -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#giGlobeBold)" stroke-width="52" />
  <ellipse cx="256" cy="256" rx="72" ry="152" fill="none" stroke="url(#giGlobeBold)" stroke-width="40" />
  <path d="M104 256h304" stroke="url(#giGlobeBold)" stroke-width="40" stroke-linecap="round" />
</svg>
